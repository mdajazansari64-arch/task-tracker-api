apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-tracker-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: task-tracker-api

  template:
    metadata:
      labels:
        app: task-tracker-api

    spec:
      containers:
        - name: task-tracker-api
          image: ajazaj/task-tracker-api:latest
          ports:
            - containerPort: 5000